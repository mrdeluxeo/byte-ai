<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Byte</title>
  <link rel="icon" type="image/webp" href="https://media.discordapp.net/attachments/1053095106321854586/1417319300183752704/ddd868fd6446cf02ae7299c87bb1f18f.png?ex=68cc0735&is=68cab5b5&hm=ecb971feab99146853fa58b06ef4ed3c45ab68017f1553381a62e54aeb6c3bf0&=&format=webp&quality=lossless&width=960&height=960">
    <style>
  /* Accent palette: dark green */
  :root{ --accent:#0b6b3a; --accent-dark:#064a2a; --accent-glow:rgba(11,107,58,0.32); }
      body {
        font-family: 'Segoe UI', 'Roboto', Arial, Helvetica, sans-serif;
        max-width:900px;
        margin:40px auto;
        padding:0 16px;
        background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
        min-height:100vh;
        color: #e0e7ef;
      }
      #header { display:flex;align-items:center;justify-content:center;gap:14px;padding-top:24px }
      h1 {
        display:flex;align-items:center;gap:12px;text-align:center;
        font-size:2.2em;font-weight:700;letter-spacing:2px;margin:0;
  color: var(--accent); text-shadow: 0 0 12px var(--accent), 0 0 4px #071;
      }
      img#logo { width:56px;height:56px;border-radius:12px;box-shadow:0 4px 18px var(--accent-glow);object-fit:cover }
      #chat-container {
        margin-bottom:110px;
        max-width:900px;
        margin:0 auto;
        padding:0 16px;
        border-radius:32px;
        background: rgba(20,30,40,0.7);
  box-shadow: 0 4px 32px var(--accent-glow), 0 1px 8px #071a;
        min-height:400px;
        border: 1px solid var(--accent);
      }
      #chat-form {
        position:fixed;
        bottom:0;left:0;right:0;width:100%;
  background: linear-gradient(90deg,#0f2027 60%, var(--accent) 100%);
        padding:18px 0 18px 0;
        box-shadow:0 -2px 24px var(--accent-glow),0 -1px 8px #222a;
        display:flex;gap:12px;box-sizing:border-box;
        border-top-left-radius:32px;
        border-top-right-radius:32px;
        max-width:900px;margin:auto;
      }
      textarea#q {
        flex:1;
        height:54px;
        resize:none;
        padding:14px 18px;
        border-radius:24px;
        border:1.5px solid var(--accent);
        background:rgba(20,30,40,0.9);
        color:#e0e7ef;
        font-size:1.1em;
        box-shadow:0 0 8px var(--accent-glow);
        outline:none;
        transition: border 0.2s, box-shadow 0.2s;
      }
      textarea#q:focus {
        border:2px solid var(--accent);
        box-shadow:0 0 16px var(--accent-glow);
      }
      button#ask {
        padding:0 32px;
        border-radius:24px;
        background:linear-gradient(90deg,var(--accent) 0%,#0f2027 100%);
        color:#222;
        border:none;
        font-size:1.1em;
        font-weight:600;
        box-shadow:0 0 12px var(--accent-glow);
        cursor:pointer;
        min-width:92px;
        transition: background 0.2s, color 0.2s;
      }
      button#ask:hover {
        background:linear-gradient(90deg,var(--accent) 0%,#222 100%);
        color:var(--accent);
      }
      .messages { padding:24px; display:flex; flex-direction:column; gap:12px; }
      .msg-row { display:flex; margin:0; align-items:flex-end; gap:12px; }
      .msg-user { justify-content:flex-end; }
      .msg-ai { justify-content:flex-start; }
      .message { display:flex; gap:12px; align-items:flex-end; }
  .avatar { width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#062023;background:linear-gradient(90deg,var(--accent),var(--accent-dark));box-shadow:0 4px 12px #0008; }
  .avatar.ai { background:linear-gradient(90deg,#03100a,var(--accent-dark)); color:var(--accent); }
  .bubble { max-width:74%; padding:14px 18px; border-radius:16px; font-size:1.06em; line-height:1.4; box-shadow:0 6px 24px rgba(0,0,0,0.4); position:relative; border-left:4px solid rgba(255,255,255,0.02); backdrop-filter: blur(6px); }
  .bubble.user { background:linear-gradient(180deg,var(--accent) 0%,#0f2027 100%); color:#071219; border-bottom-right-radius:6px; }
  .bubble.ai { background:linear-gradient(180deg,#071219 0%,#0b2b2d 100%); color:#dbeff0; border-bottom-left-radius:6px; }
      .bubble .meta { display:block; margin-top:8px; font-size:0.78em; color:rgba(224,231,239,0.6); }
      .bubble.user .meta { color:rgba(2,6,23,0.6); }
      .messages::-webkit-scrollbar { height:8px; width:8px; }
      .messages::-webkit-scrollbar-thumb { background: var(--accent-glow); border-radius:8px; }
      .source-link {
        font-size:0.95em;
        color:var(--accent);
        margin-top:6px;
        display:block;
        text-shadow:0 0 8px var(--accent-glow);
      }
  ::selection { background:var(--accent); color:#222; }
      @media (max-width:600px) {
        #chat-container, #chat-form { max-width:100vw; border-radius:0; }
        body { padding:0; }
      }
    </style>
  </head>
  <body>
    <div id="header">
      <img id="logo" src="https://media.discordapp.net/attachments/1053095106321854586/1417319300183752704/ddd868fd6446cf02ae7299c87bb1f18f.png?ex=68cc0735&is=68cab5b5&hm=ecb971feab99146853fa58b06ef4ed3c45ab68017f1553381a62e54aeb6c3bf0&=&format=webp&quality=lossless&width=960&height=960" alt="Byte logo">
      <h1>Byte</h1>
    </div>
    <div id="chat-container">
      <div id="messages" class="messages" aria-live="polite"></div>
    </div>
    <form id="chat-form">
      <textarea id="q" placeholder="Type your message..."></textarea>
      <button id="ask" type="submit">Send</button>
    </form>

    <script>
      const messages = document.getElementById('messages');
      const form = document.getElementById('chat-form');
      const textarea = document.getElementById('q');

      function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function addMessage(text, sender, source) {
        const msg = document.createElement('div');
        msg.className = 'message ' + sender;

        const avatar = document.createElement('div');
        avatar.className = 'avatar ' + (sender === 'ai' ? 'ai' : 'user');
        avatar.textContent = sender === 'ai' ? 'B' : 'U';

        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + sender;
        bubble.innerHTML = text.replace(/\n/g, '<br>');

        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = nowTime();
        bubble.appendChild(meta);

        if (sender === 'ai' && source) {
          const link = document.createElement('a');
          link.className = 'source-link';
          link.href = source.url;
          link.target = '_blank';
          link.textContent = source.title || source.url;
          bubble.appendChild(document.createElement('br'));
          bubble.appendChild(link);
        }

        if (sender === 'ai') {
          msg.appendChild(avatar);
          msg.appendChild(bubble);
        } else {
          msg.appendChild(bubble);
          msg.appendChild(avatar);
        }

        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
      }

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = textarea.value.trim();
        if (!q) return;
        addMessage(q, 'user');
        textarea.value = '';
        addMessage('Thinking...', 'ai');
        try {
          const res = await fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Unknown');
          // Remove the last AI 'Thinking...' message (if present)
          const lastAI = Array.from(messages.querySelectorAll('.message.ai')).pop();
          if (lastAI) messages.removeChild(lastAI);
          addMessage(json.answer, 'ai', { url: json.source, title: json.title });
        } catch (e) {
          const lastAI = Array.from(messages.querySelectorAll('.message.ai')).pop();
          if (lastAI) messages.removeChild(lastAI);
          addMessage('Error: ' + e.message, 'ai');
        }
      });
    </script>
  </body>
</html>
